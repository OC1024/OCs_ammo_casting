[technology-description]
casting-light-ammo-tech=Schaltet das Gießen von leichter Munition frei. Dies ist eine Schlüsseltechnologie für das Gießen weiterer Munitionsarten.
casting-heavy-ammo-tech=Schaltet das Gießen von schwerer Munition frei. Damit können auch Kanonengeschosse gegossen werden.
casting-explosive-ammo-tech=Schaltet das Gießen von (uranversetzte) explosive Kanonengeschosse und die Herstellung von schweren Artelleriegranaten frei.
casting-railgun-ammo-tech=Schaltet das Gießen von Schienenkanonen-Munition frei. Damit auch die stärkste Muniton großindustriell gegossen werden kann.
casting-tungsten-ammo-tech=Schaltet die Herstellung und das Gießen von Wolfram-Munition frei. Damit können auch extrem widerstandsfähige panzerbrechende Munition und Geschosse gegossen werden.
nuclear-ammo-tech=Schaltet das Atombombenrezept in der Tieftemperaturanlage frei.

bio-explosives-tech=Schaltet ein Rezept in der Biokammer für Sprengstoff frei.

light-armour-plating-tech=Einfache aber widerstandsfähige Panzerplatten sind sehr langsam zu regenerieren.
heavy-armour-plating=Stärkere Waffen erfordern stärksten Schutz.
tungsten-armour-plating=Wolfram-Panzerplatten sind extrem widerstandsfähig aber äußerst langsam.
reactive-armour-plating=Reaktive Panzerplatten sind ein guter Mittelweg zwischen Geschwindigkeit und Widerstandsfähigkeit.
ultra-light-armour-plating=Komposit-Panzerplatten sind deutlich schneller, aber immer noch keine Schilde.

casting-modular-turrets=Schaltet das Gießen von Front- und Hinterlinien-Geschützturmbasen sowie schweren Schrotflinten-Geschütztürmen frei.



[mod-setting-name]
casting-weapons=Erlaube das Gießen von Geschütztürmen und Waffen.
allow-casting-explosive-ammo=Erlaube das Gießen von Explosionsmunition.
heavy-artillery-shells=Erlaube mittlere und schwere Artelleriegranaten.

allow-bio-explosives=Erlaube Biosprengstoffe und -raketen.
space-fish=Erlaube Fischzucht im Weltraum.
fulgora-coal=Ersetzt Festbrennstoff durch Kohle in der Schrottrecyclingrezept.

armour-plating=Aktiviert den Technologiebaum für Panzerplatten.
early-armor-grid=Frühes Ausrüstungsgitter für Rüstung.
earlier-armor-plating=Frühere Panzerplatten
earlier-solar-panel-equipment=Frühe Solarpanel-Ausrüstung

tungsten-steel-ammo=Wolframstahl für manche Wolfram-Munition verwenden.
uranium-shotgun-shell=Aktiviert Uranschrotpatronen.
nuclear-ammo=Aktiviert die Alternativrezepte für Nukulare Munition.
antimatter-ammo=Aktiviert die Alternativrezepte für Antimaterie-Munition.

earlier-alt-ammo-techs=Frühere Technologien für Alternativrezepte

[mod-setting-description]
allow-casting-explosive-ammo=Aktiviert das Gießen von explosiven Kanonengeschosse und (optional) Artelleriegranaten.
space-fish=Ermöglicht einen abgeschlossenen Zyklus für Nährstoffe im Weltraum, macht es aber (zu) einfach.
fulgora-coal=Fügt Kohle hinzu, auch wenn fester Brennstoff nicht mehr im Rezept enthalten ist.Wird ignoriert, wenn Kohle bereits im Schrottrecyclingrezept ist.\nEmpfohlen, wenn du auf Fulgora beginnst, da es die militärische Forschung auf Fulgora ermöglicht.

armour-plating=Wenn dir das Balancing nicht gefällt, schreibe mir gerne auf der Mod-Seite dein Feedback. Vielen Dank!
early-armor-grid=Fügt ein winziges Ausrüstungsgitter für leichte bzw. schwere Rüstung hinzu.
earlier-armor-plating=Verlagere die ersten beiden Stufen der Panzerplatten früher in den Technologiebaum. Diese sind dann auch etwas günstiger.
earlier-solar-panel-equipment=Verlagere die Solarpanel-Ausrüstung früher in den Technologiebaum. Ersetze die 2 roten durch 10 grüne Schaltkreise.

heavy-artillery-shells=Vanilla Artelleriegranaten sind nun mittlere und die DLC Artelleriegranaten sind nun die schweren Artelleriegranaten.
# casting-weapons=Aktiviert alternative Rezepte für Geschütztürme und Handwaffen
tungsten-steel-ammo=Ersetzt Wolframkarbit zu Wolframstahl für die Herstellung von Wolfram-Munition. Wahrscheinlich realistischer.\nBetroffene Rezepte: Wolframmunition, Wolframkanonengeschoss, Wolfram-Schienenkanonen-Munition
nuclear-ammo=Z.B. Atombombe.
antimatter-ammo=Antimaterie-Munition aus [Krastorio2-Spaced-Out]. Benötigt auch das alternativrezept für die Atombombe, wenn die Option Antimaterie-Munition genutzt wird.

earlier-alt-ammo-techs=Entfernt die nicht-Nauvis Wissenschaftspakette für die Technologien der Alternatifrezepte. [Any Planet Start] und [Planet Picker] Mods aktivieren auch Teile hiervon.

[string-mod-setting]
early-armor-grid-light-armor=Leichte Rüstung
early-armor-grid-heavy-armor=Schwere Rüstung
early-armor-grid-none=Keine

