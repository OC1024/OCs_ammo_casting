[mod-setting-description]
allow-casting-explosive-ammo=Aktiviert das Gießen von explosiven Kanonengeschosse und (optional) Artelleriegranaten.
heavy-artillery-shells=Vanilla Artelleriegranaten sind nun mittlere und die DLC Artelleriegranaten sind nun die schweren Artelleriegranaten.

# casting-weapons=Aktiviert alternative Rezepte für Geschütztürme und Handwaffen
space-fish=Ermöglicht einen abgeschlossenen Zyklus für Nährstoffe im Weltraum, macht es aber (zu) einfach.

armour-plating=Wenn dir das Balancing nicht gefällt, schreibe mir gerne auf der Mod-Seite dein Feedback. Vielen Dank!
early-armor-grid=Fügt ein winziges Ausrüstungsgitter für leichte bzw. schwere Rüstung hinzu.
earlier-armor-plating=Verlagere die ersten beiden Stufen der Panzerplatten früher in den Technologiebaum. Diese sind dann auch etwas günstiger.
earlier-solar-panel-equipment=Verlagere die Solarpanel-Ausrüstung früher in den Technologiebaum. Ersetze die 2 roten durch 10 grüne Schaltkreise.

