[technology-description]
casting-light-ammo-tech=Schaltet das Gießen von leichter Munition frei. Dies ist eine Schlüsseltechnologie für das Gießen weiterer Munitionsarten.
casting-heavy-ammo-tech=Schaltet das Gießen von schwerer Munition frei. Damit können auch Kanonengeschosse gegossen werden.
casting-explosive-ammo-tech=Schaltet das Gießen von (uranversetzte) explosive Kanonengeschosse und die Herstellung von schweren Artelleriegranaten frei.
casting-railgun-ammo-tech=Schaltet das Gießen von Schienenkanonen-Munition frei. Damit auch die stärkste Muniton großindustriell gegossen werden kann.
casting-tungsten-ammo-tech=Schaltet die Herstellung und das Gießen von Wolfram-Munition frei. Damit können auch extrem widerstandsfähige panzerbrechende Munition und Geschosse gegossen werden.
nuclear-ammo-tech=Schaltet das Atombombenrezept in der Tieftemperaturanlage frei.

bio-explosives-tech=Schaltet ein Rezept in der Biokammer für Sprengstoff frei.
bio-rocketry-tech=Schaltet Biokammer-Rezepte für normale und explosive Raketen frei.
bio-grenades-tech=Schaltet Biokammerrezepte für Granaten und andere explosive Munition frei.

light-armour-plating-tech=Einfache aber widerstandsfähige Panzerplatten sind sehr langsam zu regenerieren.
heavy-armour-plating=Stärkere Waffen erfordern stärksten Schutz.
tungsten-armour-plating=Wolfram-Panzerplatten sind extrem widerstandsfähig aber äußerst langsam.
reactive-armour-plating=Reaktive Panzerplatten sind ein guter Mittelweg zwischen Geschwindigkeit und Widerstandsfähigkeit.
ultra-light-armour-plating=Komposit-Panzerplatten sind deutlich schneller, aber immer noch keine Schilde.

casting-modular-turrets=Schaltet das Gießen von Front- und Hinterlinien-Geschützturmbasen sowie schweren Schrotflinten-Geschütztürmen frei.

casting-basic-mortar-ammo-tech=Gießen von einfacher Mörsermunition
casting-chemical-mortar-ammo-tech=Gießen von fortgeschrittenen chemischen Mörser Munition, wie die Feuerbombe.
pulse-mortar-ammo-tech=Schaltet alle alternativen Rezepte von Bot-basierter Munition sowie die elektrische Mörsermunition frei
biochemical-mortar-ammo-tech=Schaltet alle alternativen Rezepte frei, die meist chemisch sind, wie Giftbombe.


