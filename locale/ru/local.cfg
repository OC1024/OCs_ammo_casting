[technology-description]
casting-light-ammo-tech=Позволяет производить лёгкие боеприпасы в литейной. Эта ключевая технология позволяет изучить литьё более продвинутой аммуниции.
casting-heavy-ammo-tech=Позволяет отливать тяжёлые боеприпасы, в том числе пушечные снаряды.
casting-explosive-ammo-tech=Позволяет отливать разрывные пушечные снаряды и производить тяжёлые артиллерийские снаряды.
casting-railgun-ammo-tech=Позволяет отливать рельсотронные снаряды, сильнейший вид аммуниции на большом масштабе.
casting-tungsten-ammo-tech=Позволяет отливать вольфрамовые боеприпасы, более дальнобойные и обладающие чрезвычайной пробивной способностью.
nuclear-ammo-tech=Открывает для криогенного завода рецепты, позволяющие производить ядерное оружие.

bio-explosives-tech=Открывает рецепты взрывчатых веществ для биокамеры.
bio-rocketry-tech=Открывает рецепты обычных и разрывных ракет для биокамеры.

light-armour-plating-tech=Простая, но устойчивая бронепластина с крайне низкой скоростью зарядки.
heavy-armour-plating=Сильному мечу - сильный щит.
tungsten-armour-plating=Вольфрамовые бронепластины. Чрезвычайно устойчивы, но медлено заряжаются.
reactive-armour-plating=Реактивная бронепластина - компромисс между устойчивостью и разумной скоростью заряда. 
ultra-light-armour-plating=Композитные бронепластины заряжаются значительно быстрее, уступая только энергетическим щитам.

# scattergun_turret mod
casting-modular-turrets=Позволяет отливать передовые и тыловые основания турелей, а так же дробовую турель. 

# mortar turret and others
casting-basic-mortar-ammo-tech=Литьё базовых миномётных снарядов.
casting-chemical-mortar-ammo-tech=Литьё продвинутых химических миномётных снарядов сродни зажигательным. 
pulse-mortar-ammo-tech=Разблокирует все альтернативные рецепты миномётных капсул с дронами и электрические миномётные снаряды.
biochemical-mortar-ammo-tech=Разблокирует все альтернативные рецепты, преимущественно химические, наподобие ядовитой бомбы.

