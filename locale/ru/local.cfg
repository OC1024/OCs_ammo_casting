earlier-alt-ammo-techs=Более ранние альтернативные технологии для боеприпасов

[mod-setting-description]
allow-casting-explosive-ammo=Позволяет отливать разрывные (урановые) пушечные снаряды и (опционально) тяжёлые артиллерийские снаряды.
space-fish=Создаёт замкнутую цепочку производства питательных веществ в космосе, но делает игру (чрезмерно) лёгкой.
fulgora-coal=Добавляет уголь, даже если твёрдое топливо больше не в рецепте. Игнорируется, если уголь есть в рецепте переработки мусора.\nРекомендовано для начинающих игру на Фульгоре, так как позволяет производить там военную науку.

armour-plating=Если вам не нравится баланс, чувствуйте себя свободными обратиться ко мне на странице мода. Большое вам спасибо!
early-armor-grid=Добавляет крошечную сетку снаряжения лёгкой и тяжёлой броне.
earlier-armor-plating=Сдвигает первые два вида броневых плит к началу дерева технологий. Так же немного удешевляет их создание.
earlier-solar-panel-equipment=Сдвигает портативные солнечные панели к началу дерева технологий. Заменяет 2 продвинутых схемы на 10 электросхем.

heavy-artillery-shells=Артиллерийские снаряды из базовой игры теперь средние, а вариант из DLC - тяжёлые.
# casting-weapons=Добавляет рецепты литья некоторых турелей и ручного оружия.
tungsten-steel-ammo=Заменяет карбид вольфрама на вольфрамовые балки при производстве вольфрамовых боеприпасов. Возможно, это более реалистично.\n Затрагивает рецепты: Магазинов с вольфрамовыми патронами, Вольфрамовых пушечных снарядов, Вольфрамовых рельсотронных снарядов.
casting-grenates=Я не нахожу это реалистичным, но не мне судить.
nuclear-ammo=Ну например атомная бомба.
antimatter-ammo=антиматериальные боеприпасы из мода [Krastorio2-Spaced-Out]. Требует альтернативный рецепт для атомной бомбы, если используется.

earlier-alt-ammo-techs=Убрать научные пакеты, не родные Наувису, из альтернативных технологий боеприпасов. Моды [Any Planet Start] и [Planet Picker] активируют часть этой опции.

[string-mod-setting]
early-armor-grid-light-armor=Лёгкая броня
early-armor-grid-heavy-armor=Тяжёлая броня
early-armor-grid-none=Никогда

