casting-weapons=Позволяет отливать турели и оружие.
allow-casting-explosive-ammo=Позволяет отливать разрывные боеприпасы.
heavy-artillery-shells=Включает обычные и тяжёлые артиллерийские снаряды.

allow-bio-explosives=Позволяет создавать био-взрывчатку и био-ракеты.
space-fish=Позволяет разводить рыбу в космосе.
fulgora-coal=Заменяет твёрдое топливо на уголь для рецепта переработки фульгорианского мусора.

armour-plating=Активирует дерево технологий бронепластин.
early-armor-grid=Сетка снаряжения для ранних видов брони.
earlier-armor-plating=Более ранние бронепластины.
earlier-solar-panel-equipment=Более ранние портативные солнечные панели.

tungsten-steel-ammo=Использовать вольфрамовые балки в рецептах некоторых вольфрамовых боеприпасов.
uranium-shotgun-shell=Активировать урановые патроны для дробовика.
casting-grenates=Активировать рецепты литья гранат.
nuclear-ammo=Активировать альтернативные рецепты ядерного оружия.
antimatter-ammo=Активировать альтернативные рецепты антиматериальных боеприпасов.

earlier-alt-ammo-techs=Более ранние альтернативные технологии по производству боеприпасов.

[mod-setting-description]
allow-casting-explosive-ammo=Включает литьё разрывных (урановых) пушечных снарядов и (опционально) тяжёлых артиллерийских снарядов.
space-fish=Создаёт замкнутую цепочку рецептов для добычи нутриентов в космосе. Серьёзное упрощение.
fulgora-coal=Добавляет уголь, если в рецепте переработки нету твёрдого топлива. Игнорируется, если уголь уже есть в рецепте переработки мусора.\nРекомендуется для инженеров, начинающих игру на фульгоре, так как позволяет производить там военные исследовательские пакеты из местных ресурсов. 

armour-plating=Если вам не по нраву баланс, будьте вольны связаться со мной через страницу мода. Большое вам спасибо!
early-armor-grid=Добавляет крохотную сетку снаряжения для лёгкой и тяжёлой брони
earlier-armor-plating=Сдвигает первые две бронепластины ближе к началу дерева технологий, делая их доступными раньше. Также удешевляет рецепт их производства.
earlier-solar-panel-equipment=Сдвигает портативные солнечные ближе к началу дерева технологий. Заменяет две продвинутые схемы на десять электросхем. 

heavy-artillery-shells=Ванильные артиллерийские снаряды теперь обычные, а добавленные в DLC - тяжёлые.
# casting-weapons=Позволяет отливать некоторые турели и ручное оружие 
tungsten-steel-ammo=Заменяет карбид вольфрама на вольфрамовые балки в производстве вольфрамовых боеприпасов. Реалистично.\nЗатронутые рецепты: вольфрамовые патроны, вольфрамовые пушечные снаряды, вольфрамовые рельсотронные снаряды.
casting-grenates=Мне это мнится нереалистичным, но кто я такой, чтоб осуждать ваш стиль игры.
nuclear-ammo=например, атомная бомба 
antimatter-ammo=антиматериальные боеприпасы из мода [Krastorio2-Spaced-Out]. Требует альтернативный рецепт атомной бомбы, если эта опция включена.

earlier-alt-ammo-techs=Убирает науку других планет из альтернативных технологий производства боеприпасов. Моды [Any Planet Start] и [Planet Picker] частично включают эту опцию.

[string-mod-setting]
early-armor-grid-light-armor=Лёгкая броня
early-armor-grid-heavy-armor=Тяжёлая броня
early-armor-grid-none=Ничего