[technology-description]
casting-light-ammo-tech=Unlocks the casting of light ammo. This is a key technology as it unlocks further ammo casting technologies.
casting-heavy-ammo-tech=Unlocks the casting of heavy ammo. This allows the casting of cannon shells.
casting-explosive-ammo-tech=Unlocks the casting of (uranium) explosive cannon shells and the production of heavy artillery shells.
casting-railgun-ammo-tech=Unlocks the casting of railgun ammo. This allows the casting of the strongest ammo in large scale.
casting-tungsten-ammo-tech=Unlocks the crafting and casting of tungsten ammo. This allows the casting of extremely resistant piercing ammo and shells.
nuclear-ammo-tech=Unlocks the cryo-plant recipes for the atomic bomb.

bio-explosives-tech=Unlocks biochamber recipes for explosives.
bio-rocketry-tech=Unlocks biochamber recipe for normal and explosive rockets.

light-armour-plating-tech=Simple yet resistant armoured plating are very slow to recharge.
heavy-armour-plating=Stronger weapons require stronger armour.
tungsten-armour-plating=Tungsten armour plating are extremely resistent but very slow.
reactive-armour-plating=Reaktive armour plating is a coppromise between speed and armour points.
ultra-light-armour-plating=Composite armour plating are significant faster but still no shields.

# scattergun_turret mod
casting-modular-turrets=Unlocks casting of front and back line turret base as well as of the scattergun turret

# Krastorio2
