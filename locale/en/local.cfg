[technology-description]
casting-light-ammo-tech=Unlocks the casting of light ammo. This is a key technology as it unlocks further ammo casting technologies.
casting-heavy-ammo-tech=Unlocks the casting of heavy ammo. This allows the casting of cannon shells.
casting-explosive-ammo-tech=Unlocks the casting of (uranium) explosive cannon shells and the production of heavy artillery shells.
casting-railgun-ammo-tech=Unlocks the casting of railgun ammo. This allows the casting of the strongest ammo in large scale.
casting-tungsten-ammo-tech=Unlocks the crafting and casting of tungsten ammo. This allows the casting of extremely resistant piercing ammo and shells.
nuclear-ammo-tech=Unlocks the cryo-plant recipes for the atomic bomb.

bio-explosives-tech=Unlocks biochamber recipes for explosives.
bio-rocketry-tech=Unlocks biochamber recipes for normal and explosive rockets.
bio-grenades-tech=Unlocks biochamber recipes for grenades and other explosive ammo.

light-armour-plating-tech=Simple yet resistant armored plating are very slow to recharge.
heavy-armour-plating=Stronger weapons require stronger armor.
tungsten-armour-plating=Tungsten armor plating are extremely resistent but very slow.
reactive-armour-plating=Reaktive armor plating is a coppromise between speed and armor points.
ultra-light-armour-plating=Composite armor plating are significant faster but still no shields.

# scattergun_turret mod
casting-modular-turrets=Unlocks casting of front and back line turret base as well as of the scattergun turret

# mortar turret and others
casting-basic-mortar-ammo-tech=Casting of basic mortar ammo
casting-chemical-mortar-ammo-tech=Casting of advanced chemical mortar ammo, like the fire bomb.
pulse-mortar-ammo-tech=Unlocks all alternative recipes of bot-based mortar ammo as well as the electrical mortar ammo
biochemical-mortar-ammo-tech=Unlocks all alternative recipes which are mostly chemical, like poison bomb.

