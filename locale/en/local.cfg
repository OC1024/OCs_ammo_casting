[mod-setting-description]
allow-casting-explosive-ammo=Enable the casting of heavy artillery shells.
space-fish=Enables a closed loop for nutriens in space, but makes it (too) easy.
armour-plating=If you dislike the balance, feel free to give me feedback on the mod page. Thank you very much!
tungsten-steel-ammo=Replaces tungsten carbide with tungsten steel for the production of tungsten ammo. Probably more realistic.