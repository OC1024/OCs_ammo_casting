[mod-setting-description]
allow-casting-explosive-ammo=Enable the casting of explosive (uranium) cannon shells and (optionally) heavy artillery shells.
space-fish=Enables a closed loop for nutriens in space, but makes it (too) easy.

armour-plating=If you dislike the balance, feel free to give me feedback on the mod page. Thank you very much!
early-armor-grid=Adds a tiny equipment grid to light and heavy armor.
earlier-armor-plating=Move the first two tiers of armor plating earlier in the tech tree. They are also a bit cheaper.
earlier-solar-panel-equipment=Move the solar panel equipment earlier in the tech tree. Replace 2 red circuits with 10 green circuits.

heavy-artillery-shells=Vanilla artillery shells are now medium shells and the DLC variation is now the heavy version.
# casting-weapons=Enables the casting of some turrets and handheld weapons.
tungsten-steel-ammo=Replaces tungsten carbide with tungsten steel for the production of tungsten ammo. Probably more realistic.\nAffected recipes: Tungsten rounds magazine, Tungsten cannon shell, Tungsten railgun ammo.
nuclear-ammo=E.g. atomic bomb.
antimatter-ammo=antimatter ammo from from [Krastorio2-Spaced-Out]. Requries also the alternative recipe for the atomic bomb, if the antimatter ammo option is used.

earlier-alt-ammo-techs=Remove the non-nauvis science packs from the alt ammo technologies. [Any Planet Start] also activates parts of this.

